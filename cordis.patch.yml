# dsh-plugin-soul 的 bundle patch —— 把 soul 插件挂进 DSH 配置树。
#
# DSH 的插件安装器会读取本文件（package.json 的 dsh.bundle.patch），
# 把下面的 insert 行插入 profile 的层栈。装完需要重启 DSH 才加载。
#
# 手工安装时也可以把这段追加到 ~/.dsh/profiles/<profile>/cordis.patch.yml 末尾。
- insert:
    - id: soul
      name: dsh-plugin-soul
      config: {}
      # 自我目录默认 ~/.dsh/soul；想换位置就写：
      # root: '/path/to/soul'
